<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Wings</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <div id="score">0</div>

        <div id="bird">🐦</div>

        <!-- Layar Mulai -->
        <div id="startScreen">
            <h1>Flappy Wings</h1>
            <p>Tekan layar untuk terbang!</p>

            <button id="startButton" type="button">
                Mulai
            </button>
        </div>

        <!-- Layar Game Over -->
        <div id="gameOverScreen">

            <h1>Game Over</h1>

            <p>
                Skor:
                <span id="finalScore">0</span>
            </p>

            <button id="restartButton" type="button">
                Main Lagi
            </button>

        </div>

    </div>

    <script src="script.js?v=3"></script>

</body>
</html>
